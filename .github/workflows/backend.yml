name: Backend
on:
  push:
  pull_request:
    branches: ['main']
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [test-py311, test-py312, test-py313, test-py314]
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          environments: ${{ matrix.environment }}
      - name: Ruff Linter
        run: pixi run -e ${{ matrix.environment }} "ruff check backend/"
      - name: Run pytest
        run: pixi run -e ${{ matrix.environment }} backend-tests
