[workspace]
authors = ["Byron"]
channels = ["conda-forge"]
name = "stem-foss"
platforms = ["win-64", "linux-64"]
version = "0.1.0"

[environments]
default = ["default"]
test = ["test"]

[tasks]
init-db = "(cd ./postgresql/base) || mkdir -p ./postgresql && initdb -D ./postgresql"
check-db-server = "psql -U postgres -d stem_db -c 'CREATE TABLE Test (id INT PRIMARY KEY);DROP TABLE Test' > /dev/null"
start-db-server = "(pixi run check-db-server) || pg_ctl start -D ./postgresql -o '-h localhost -p 5432' -l ./postgresql/logfile"
stop-db-server = "(pixi run check-db-server) || pg_ctl stop -D ./postgresql"
create-db = { cmd = "createuser postgres && createdb --owner postgres stem_db", depends-on = [
    "init-db",
    "start-db-server",
] }
update-nodejs = "npm install --save-dev"
compile-ts = "tsc"
watch-ts = "tsc -w"
build = "npm run build"
# pre-commit = "npx lint-staged && ruff check --fix && ruff format --line-length 88"
pre-commit = "echo 'Not implemented yet.'"

[dependencies]
python = "3.14.*"
fastapi = ">=0.135.1,<0.136"
pyyaml = ">=6.0.3,<7"
nodejs = "24.14.*"
numpy = ">=2.4.2,<3"
python-dotenv = ">=1.2.2,<2"
sqlmodel = ">=0.0.37,<0.0.38"
psycopg = ">=3.3.3,<4"
postgresql = "*"
ruff = "*"
pre-commit = "*"
uvicorn = "*"
polars = ">=1.38.1,<2"
seaborn = ">=0.13.2,<0.14"
mpld3 = ">=0.5.12,<0.6"

[feature.test.dependencies]
sqlite = "*"
pytest = "*"
pytest-cov = "*"

[feature.test.tasks]
backend-tests = "pytest --cov=app backend/tests/"

[tool.ruff]
line-length = 80

[tool.ruff.format]
docstring-code-format = true
